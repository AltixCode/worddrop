name: Continuous Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner. Hosted is the default here: the self-hosted Linux runner is not registered to this repository.'
        required: true
        default: 'github-hosted'
        type: choice
        options: [github-hosted, self-hosted]

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Tests & Bundle Verification
    # macOS rather than the self-hosted Linux runner: the only one carrying
    # `linux, x64` is the Coolify host, which is permanently busy serving
    # deployments, so jobs queued behind it indefinitely. Nothing here needs
    # Linux -- `setup-java` supplies JDK 17 anywhere and `setup-android`
    # installs the SDK itself.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --ci

      - name: i18n Completeness
        run: node scripts/check-i18n.mjs

      - name: UI Rules
        run: node scripts/check-ui-rules.mjs

      - name: Generated Data Is Up To Date
        run: |
          node scripts/build-answers.mjs
          git diff --exit-code -- src/data/answers.ts backend/src/answers.json

      - name: Validate Expo Configuration
        run: npx expo config --type public

      - name: Verify iOS Bundle Export
        run: npm run export:ios

      - name: Verify Android Bundle Export
        run: npm run export:android

  worker:
    name: Puzzle Worker
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker Dependencies
        run: cd backend && npm ci

      - name: Typecheck Worker
        run: cd backend && npm run typecheck

      - name: Client/Worker Parity Tests
        run: cd backend && npm test
