name: Build, Release & Store Submission Pipeline

on:
  # Every push to main builds both platforms. Three self-hosted macOS runners
  # each take one job at a time, so the fleet pushing is a shallow queue, not
  # one build per repo at once.
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit_to_stores:
        description: 'Automatically submit to TestFlight / Play Store'
        required: true
        default: true
        type: boolean
      ios_runner:
        description: 'iOS runner. Self-hosted by default: the signing identity lives on the Mac mini, and hosted macOS minutes bill at 10x.'
        required: true
        default: 'self-hosted'
        type: choice
        options: [self-hosted, github-hosted]
      android_runner:
        description: 'Android/Linux runner. Hosted by default: the self-hosted Linux runner is not registered to this repository.'
        required: true
        default: 'github-hosted'
        type: choice
        options: [github-hosted, self-hosted]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  # A tag build must never be interrupted; an ad-hoc dispatch may be.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The AdMob and RevenueCat identifiers the build bakes in. Absent, the app falls back to
# Google's test ad units and earns nothing, which nothing else in this pipeline notices.
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_APP_ID }}
  EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
  EXPO_PUBLIC_ADMOB_IOS_BANNER: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_BANNER }}
  EXPO_PUBLIC_ADMOB_ANDROID_BANNER: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_BANNER }}
  EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL }}
  EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL }}
  EXPO_PUBLIC_RC_IOS_KEY: ${{ vars.EXPO_PUBLIC_RC_IOS_KEY || secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
  EXPO_PUBLIC_RC_ANDROID_KEY: ${{ vars.EXPO_PUBLIC_RC_ANDROID_KEY || secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}

jobs:
  verify:
    name: Typecheck, Tests & Generated Data
    # macOS rather than the self-hosted Linux runner: the only one carrying
    # `linux, x64` is the Coolify host, which is permanently busy serving
    # deployments, so jobs queued behind it indefinitely. Nothing here needs
    # Linux -- `setup-java` supplies JDK 17 anywhere and `setup-android`
    # installs the SDK itself.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.android_runner == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Release Identifiers
        run: npm run check:release

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --ci

      - name: i18n Completeness
        run: node scripts/check-i18n.mjs

      - name: UI Rules
        run: node scripts/check-ui-rules.mjs

      - name: Generated Data Is Up To Date
        run: |
          node scripts/build-answers.mjs
          git diff --exit-code -- src/data/answers.ts backend/src/answers.json

      - name: Worker Parity & Typecheck
        run: |
          cd backend
          npm ci
          npm run typecheck
          npm test

  build-ios:
    needs: [verify]
    name: iOS Build & Package
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_runner == 'github-hosted' && 'macos-14' || fromJSON('["self-hosted", "macOS", "ARM64", "ios-signing"]') }}
    outputs:
      app_name: ${{ steps.version.outputs.app_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      app_build: ${{ steps.version.outputs.app_build }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Workspace
        run: rm -rf build ios android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Release Identifiers
        run: npm run check:release

      - name: Compute Dynamic Version & Bump app.json
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name)")
          APP_VERSION="1.0.$COMMIT_COUNT"
          APP_BUILD="$COMMIT_COUNT"
          TAG_NAME="v$APP_VERSION"

          echo "Computed Version: $APP_NAME $APP_VERSION (Build $APP_BUILD, Tag $TAG_NAME)"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = "'"$APP_VERSION"'";
            app.expo.ios = app.expo.ios || {};
            app.expo.ios.buildNumber = "'"$APP_BUILD"'";
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = parseInt("'"$APP_BUILD"'", 10);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log("Updated app.json to version", app.expo.version, "build", app.expo.ios.buildNumber);
          '

      - name: Check Purchase Keys
        run: |
          if [ -z "${EXPO_PUBLIC_RC_IOS_KEY}" ] || [ -z "${EXPO_PUBLIC_RC_ANDROID_KEY}" ]; then
            if [ "${{ vars.ENABLE_STORE_UPLOADS }}" = "true" ]; then
              echo "::error::RevenueCat SDK keys are missing; a published build would ship a paywall that cannot sell."
              exit 1
            fi
            echo "::warning::RevenueCat SDK keys are missing. The paywall will report the store as unreachable in this build."
          else
            echo "RevenueCat keys present."
          fi

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd ios
          pod install --repo-update

      - name: Build & Export Signed iOS IPA
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          mkdir -p build/output
          SCHEME=$(ls ios | grep .xcodeproj | head -n 1 | sed 's/.xcodeproj//')
          echo "Building iOS Scheme: $SCHEME"

          : "${APP_STORE_CONNECT_API_KEY_CONTENT:?Missing APP_STORE_CONNECT_API_KEY_CONTENT}"
          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing APP_STORE_CONNECT_API_KEY_ID}"
          : "${APP_STORE_CONNECT_API_KEY_ISSUER:?Missing APP_STORE_CONNECT_API_KEY_ISSUER}"

          # A self-hosted runner started by launchd does not inherit the
          # interactive session's keychain access, so `codesign` fails with
          # `errSecInternalComponent` -- a message that names neither the
          # keychain nor the key, and which looks like a broken certificate.
          #
          # Fleet Macs don't all share one login-keychain password (one
          # drifting from the shared MACOS_KEYCHAIN_PASSWORD secret breaks
          # every build routed to that machine), so the primary path imports
          # the signing certificate into a job-scoped keychain instead --
          # created and deleted within this same job, with a password that
          # never needs to match anything on the machine. This mirrors how
          # GitHub-hosted macOS runners sign: no persistent keychain touched
          # at all.
          #
          # Three-way fallback, each guarded by its own success check so a
          # failure never silently falls through into a confusing xcodebuild
          # crash minutes later:
          #   1. IOS_CERTIFICATE_P12_BASE64 set -> try the ephemeral keychain.
          #      If any step of that fails, warn and fall through to (2).
          #   2. MACOS_KEYCHAIN_PASSWORD set -> try the legacy login-keychain
          #      unlock. If THIS explicitly fails, stop the job here with a
          #      clear error -- an attempted-but-failed unlock left uncaught
          #      is exactly what used to surface as a baffling
          #      errSecInternalComponent after a full archive attempt.
          #   3. Neither secret set -> some Macs' login keychains are already
          #      unlocked and reachable with no secret at all; that has
          #      always been a valid, silent configuration and must stay one.
          P12_SIGNING_OK=0
          if [ -n "${IOS_CERTIFICATE_P12_BASE64:-}" ]; then
            if [ -z "${IOS_CERTIFICATE_PASSWORD:-}" ]; then
              echo "::warning::IOS_CERTIFICATE_P12_BASE64 is set but IOS_CERTIFICATE_PASSWORD is missing -- falling back to the legacy keychain path."
            else
              SIGNING_KEYCHAIN="$RUNNER_TEMP/signing-$$.keychain-db"
              SIGNING_KEYCHAIN_PW="$(openssl rand -base64 24)"
              if printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-cert.p12" \
                && security create-keychain -p "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN" \
                && security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN" \
                && security unlock-keychain -p "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN" \
                && security import "$RUNNER_TEMP/signing-cert.p12" -k "$SIGNING_KEYCHAIN" \
                     -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
                && { \
                     # The shared .p12 carries an Apple Development identity alongside the
                     # Distribution one it's actually for. The main archive step forces
                     # DEVELOPMENT_TEAM/CODE_SIGN_STYLE=Automatic so it always resolves
                     # Distribution correctly, but CocoaPods' own [CP] Embed Pods Frameworks
                     # script phase does its own identity lookup and can land on whichever
                     # identity it finds first -- on a keychain holding both, that silently
                     # picked Development and failed archiving with "unable to build chain
                     # to self-signed root". Deleting every Development identity right after
                     # import leaves only Distribution, so there is nothing left to pick
                     # wrong.
                     security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" 2>/dev/null \
                     | grep -oE '"[^"]*Development[^"]*"' | tr -d '"' \
                     | while IFS= read -r cn; do security delete-identity -c "$cn" "$SIGNING_KEYCHAIN" 2>/dev/null || true; done; true; } \
                && security set-key-partition-list -S apple-tool:,apple:,codesign: \
                     -s -k "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN" >/dev/null \
                && security list-keychains -d user -s "$SIGNING_KEYCHAIN"
              then
                echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
                P12_SIGNING_OK=1
                echo "Imported signing certificate into a job-scoped keychain."
              else
                echo "::warning::Ephemeral-keychain import failed -- falling back to the legacy login-keychain unlock."
                security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
              fi
              rm -f "$RUNNER_TEMP/signing-cert.p12"
            fi
          fi

          if [ "$P12_SIGNING_OK" != "1" ]; then
            if [ -n "${MACOS_KEYCHAIN_PASSWORD:-}" ]; then
              KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
              if ! security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"; then
                echo "::error::Failed to unlock the login keychain with MACOS_KEYCHAIN_PASSWORD. This Mac's actual login password no longer matches the shared secret. Fix it on the Mac, or (preferred) set IOS_CERTIFICATE_P12_BASE64/IOS_CERTIFICATE_PASSWORD so this repo stops depending on any one machine's keychain password."
                exit 1
              fi
              security set-key-partition-list -S apple-tool:,apple:,codesign: \
                -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1 || true
              echo "::warning::Using legacy login-keychain unlock -- set IOS_CERTIFICATE_P12_BASE64/IOS_CERTIFICATE_PASSWORD to stop depending on this Mac's own password."
            else
              echo "::warning::Neither IOS_CERTIFICATE_P12_BASE64 nor MACOS_KEYCHAIN_PASSWORD is set. Proceeding on the assumption this Mac's keychain is already unlocked and reachable -- if this archive fails with errSecInternalComponent, it is not."
            fi
          fi
          AUTH_KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$AUTH_KEY"
          chmod 600 "$AUTH_KEY"
          if [ -f "$AUTH_KEY" ]; then
            echo "Archiving with App Store Connect API Key..."
            xcodebuild archive \
              -workspace "ios/${SCHEME}.xcworkspace" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/${SCHEME}.xcarchive" \
              -derivedDataPath "build/DerivedData" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$AUTH_KEY" \
              -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER" \
              CODE_SIGN_STYLE=Automatic \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEVELOPMENT_TEAM="8Q8Y559285"
          else
            echo "Archiving with local signing..."
            xcodebuild archive \
              -workspace "ios/${SCHEME}.xcworkspace" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/${SCHEME}.xcarchive" \
              -derivedDataPath "build/DerivedData" \
              CODE_SIGN_STYLE=Automatic \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEVELOPMENT_TEAM="8Q8Y559285"
          fi

          cat << 'PLIST_EOF' > build/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>8Q8Y559285</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST_EOF

          if [ -f "$AUTH_KEY" ]; then
            xcodebuild -exportArchive \
              -archivePath "build/${SCHEME}.xcarchive" \
              -exportPath "build/output" \
              -exportOptionsPlist "build/exportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$AUTH_KEY" \
              -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER"
          else
            xcodebuild -exportArchive \
              -archivePath "build/${SCHEME}.xcarchive" \
              -exportPath "build/output" \
              -exportOptionsPlist "build/exportOptions.plist"
          fi

          RAW_IPA=$(find build/output -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$RAW_IPA" ] && [ -f "$RAW_IPA" ]; then
            cp "$RAW_IPA" "build/output/${APP_NAME}-${APP_VERSION}.ipa"
            echo "Successfully generated IPA at build/output/${APP_NAME}-${APP_VERSION}.ipa"
          else
            echo "::error::No IPA generated in build/output"
            exit 1
          fi

      - name: Verify the IPA can launch
        # Read the binary BEFORE it is uploaded, not after it is attached.
        #
        # Four apps in this portfolio were rejected by Apple carrying
        # `GADApplicationIdentifier = "-"`, which makes the Google Mobile Ads
        # SDK raise at startup: the app dies on launch. `attach-verified-build.py`
        # exists to catch that, but it reads the CI **artifact** -- so when the
        # org is over its Actions artifact storage quota, no artifact is stashed,
        # the verifier cannot read a binary, and it correctly refuses to attach
        # anything. A whole night of releases sat unattachable for that reason.
        #
        # The IPA is right here, on disk, before any of that. Checking it now
        # costs a second, removes the artifact dependency from the safety
        # property, and stops a crashing build from reaching TestFlight at all
        # rather than catching it on the way out.
        #
        # This does not replace the attach-time check. Two independent reads of
        # the same fact is the point.
        run: |
          set -euo pipefail
          IPA=$(find build/output -name "*.ipa" | head -n 1)
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          PLIST=$(find "$WORK/Payload" -maxdepth 2 -name Info.plist | head -n 1)
          GAD=$(/usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" 2>/dev/null || true)
          echo "GADApplicationIdentifier = '${GAD}'"
          case "$GAD" in
            ca-app-pub-*~*)
              echo "ok: a well-formed AdMob application identifier" ;;
            "")
              echo "::error::GADApplicationIdentifier is EMPTY. The Google Mobile Ads SDK raises at startup and the app dies on launch. Check that this repo's ADMOB app-id secret is set and that app.config.ts falls back with || rather than ??, which keeps an empty string."
              exit 1 ;;
            *)
              echo "::error::GADApplicationIdentifier is '${GAD}', which is not of the form ca-app-pub-...~... The SDK will raise at startup."
              exit 1 ;;
          esac
          rm -rf "$WORK"

      - name: Upload to TestFlight
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.submit_to_stores == true) || vars.ENABLE_STORE_UPLOADS == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
        run: |
          : "${APP_STORE_CONNECT_API_KEY_CONTENT:?Missing APP_STORE_CONNECT_API_KEY_CONTENT}"
          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing APP_STORE_CONNECT_API_KEY_ID}"
          : "${APP_STORE_CONNECT_API_KEY_ISSUER:?Missing APP_STORE_CONNECT_API_KEY_ISSUER}"
          # altool does NOT accept a path to the key. Given --apiKey it searches
          # four fixed directories and nowhere else:
          #   ./private_keys, ~/private_keys, ~/.private_keys, ~/.appstoreconnect/private_keys
          # Writing it to $RUNNER_TEMP fails with "Failed to load AuthKey file. (-43)".
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          TARGET_IPA=$(find build/output -name "*.ipa" 2>/dev/null | head -n 1)
          [ -n "$TARGET_IPA" ] && [ -f "$TARGET_IPA" ] || { echo "::error::IPA missing"; exit 1; }
          xcrun altool --upload-app -f "$TARGET_IPA" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER"

      - name: Auto-add build to TestFlight Internal Testers
        # ASC's own "Automatic distribution" toggle (hasAccessToAllBuilds) is
        # read-only after a beta group is created -- PATCHing it returns
        # 409 ENTITY_ERROR.ATTRIBUTE.NOT_ALLOWED. Apple only sets it true on
        # an app's implicit default group; any other internal group (including
        # ones this portfolio created) is permanently manual-distribution.
        # Found 2026-09-25: every app's upload was succeeding and Apple was
        # processing it (VALID), the build just never reached internal
        # testers because nothing ever attached it to the group. This step
        # does that attachment itself, right after every successful upload,
        # matched by isInternalGroup (not by the group's name -- that varies
        # across apps) so a rename never breaks it. The script is base64'd
        # rather than a heredoc because a heredoc terminator has to sit at
        # column 0, which a YAML block-scalar step body can't do without
        # ending the block scalar early.
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.submit_to_stores == true) || vars.ENABLE_STORE_UPLOADS == 'true' }}
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
          APP_BUILD: ${{ steps.version.outputs.app_build }}
        run: |
          BUNDLE_ID=$(grep -ohE "com\.[a-zA-Z0-9]+\.[a-zA-Z0-9_]+" app.config.ts app.json 2>/dev/null | head -1)
          if [ -z "$BUNDLE_ID" ]; then
            echo "::warning::Could not determine bundle id; skipping TestFlight group link"
            exit 0
          fi
          pip3 install --quiet --user pyjwt cryptography 2>&1 | tail -5
          echo "" | base64 -d > "$RUNNER_TEMP/tf_autolink.py"
          python3 "$RUNNER_TEMP/tf_autolink.py" "$BUNDLE_ID" "$APP_BUILD"

      - name: Stash iOS Artifacts
        if: github.server_url == 'https://github.com'
        # A stash failure must not fail the release.
        #
        # This uploads a convenience COPY of an artefact the pipeline has
        # already delivered: the IPA goes to TestFlight and App Store Connect
        # in an earlier step, and the AAB to Play. When the org hits the
        # Actions artifact storage quota this step fails with
        # "Failed to CreateArtifact: Artifact storage quota has been hit",
        # and it took whole release runs red on builds that had succeeded and
        # already uploaded. A red run that is not a broken build is worse than
        # no run at all, because it trains people to ignore red.
        #
        # `continue-on-error` still marks the step failed and annotates the
        # run, so the quota problem stays visible. It just stops it pretending
        # the release failed.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: build/output/*.ipa
          if-no-files-found: ignore

      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
            security list-keychains -d user -s login.keychain-db 2>/dev/null || true
          fi

  build-android:
    name: Android Build & Package
    needs: [verify]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    # android-build: hetzner-coolify-runner + Atas-Mac-mini only (has the
    # Android SDK installed; the other two Macs don't, and stay iOS-only so
    # their signing capacity isn't contended). Added as a fallback after both
    # of the org's self-hosted runners silently stopped polling for ~5 hours
    # on 2026-09-18 with no backup for either platform.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.android_runner == 'github-hosted' && 'ubuntu-24.04' || fromJSON('["self-hosted", "android-build"]') }}
    outputs:
      app_name: ${{ steps.version.outputs.app_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      app_build: ${{ steps.version.outputs.app_build }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Refuse to build if the host is short of disk
        # Self-hosted only, deliberately.
        #
        # None of what follows is true of a GitHub-hosted runner: it is an
        # ephemeral VM destroyed when the job ends, with nothing on it to
        # protect. A hosted ubuntu-24.04 image reports 14G free, one gigabyte
        # under this floor, so the guard failed every hosted build instantly --
        # and `android_runner: github-hosted` exists precisely as the escape
        # hatch for when the single self-hosted Linux runner is starved. The
        # safety net was disabling the fallback it was meant to make safe: 26
        # Android jobs queued behind one machine while four runners sat idle.
        #
        # One of the two Linux runners shares a host with the production
        # Coolify estate -- 36 containers -- and that host filled its own disk
        # on 2026-09-13 and was stopped for it. A full disk 404s every site on
        # it. Measured, one Android build consumes about 6 GB, most of it the
        # SDK, which is then reused; what accumulates per repo afterwards is
        # node_modules, and 44 of those would not fit. Hence this floor, and
        # the cleanup at the end of the job.
        #
        # Failing a build costs a re-run. Failing this host costs the websites.
        if: runner.environment == 'self-hosted'
        run: |
          # `df --output` is GNU-only and the runner image may ship busybox df,
          # where it fails and the guard silently measures nothing.
          free_gb=$(df -Pk / | awk 'NR==2 {print int($4/1024/1024)}')
          echo "free on this runner: ${free_gb}G"
          if [ "${free_gb:-0}" -lt 15 ]; then
            echo "::error::only ${free_gb}G free — refusing to build rather than risk the host"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Workspace
        run: rm -rf build ios android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Release Identifiers
        run: npm run check:release

      - name: Compute Dynamic Version & Bump app.json
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name)")
          APP_VERSION="1.0.$COMMIT_COUNT"
          APP_BUILD="$COMMIT_COUNT"
          TAG_NAME="v$APP_VERSION"

          echo "Computed Version: $APP_NAME $APP_VERSION (Build $APP_BUILD, Tag $TAG_NAME)"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = "'"$APP_VERSION"'";
            app.expo.ios = app.expo.ios || {};
            app.expo.ios.buildNumber = "'"$APP_BUILD"'";
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = parseInt("'"$APP_BUILD"'", 10);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log("Updated app.json to version", app.expo.version, "build", app.expo.android.versionCode);
          '

      - name: Check Purchase Keys
        run: |
          if [ -z "${EXPO_PUBLIC_RC_IOS_KEY}" ] || [ -z "${EXPO_PUBLIC_RC_ANDROID_KEY}" ]; then
            if [ "${{ vars.ENABLE_STORE_UPLOADS }}" = "true" ]; then
              echo "::error::RevenueCat SDK keys are missing; a published build would ship a paywall that cannot sell."
              exit 1
            fi
            echo "::warning::RevenueCat SDK keys are missing. The paywall will report the store as unreachable in this build."
          else
            echo "RevenueCat keys present."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install nothing here. The action's default package list is
          # "tools platform-tools", and `tools` was removed from Google's SDK
          # repository -- sdkmanager exits 1 with "Failed to find package
          # 'tools'" and takes the whole job with it. The next step already
          # names every package this build actually needs, so the default was
          # only ever installing an obsolete one we do not use.
          packages: ''

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Configure Android release signing
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          : "${APP_KEYSTORE_BASE64:?Missing APP_KEYSTORE_BASE64}"
          : "${APP_KEYSTORE_PASSWORD:?Missing APP_KEYSTORE_PASSWORD}"
          : "${APP_KEYSTORE_ALIAS:?Missing APP_KEYSTORE_ALIAS}"
          : "${APP_KEY_PASSWORD:?Missing APP_KEY_PASSWORD}"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$APP_KEYSTORE_PASSWORD" -alias "$APP_KEYSTORE_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$APP_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$APP_KEYSTORE_ALIAS"
            echo "KEY_PASSWORD=$APP_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK & AAB
        run: |
          mkdir -p build/output
          cd android
          echo "Building Release APK..."
          ./gradlew assembleRelease --stacktrace \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          echo "Building Release AAB Bundle..."
          ./gradlew bundleRelease --stacktrace \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          cd ..

          RAW_APK=$(find android/app/build/outputs/apk -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
            cp "$RAW_APK" "build/output/${APP_NAME}-${APP_VERSION}.apk"
            echo "Successfully generated APK at build/output/${APP_NAME}-${APP_VERSION}.apk"
          else
            echo "::error::Release APK was not produced"
            exit 1
          fi

          RAW_AAB=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$RAW_AAB" ] && [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" "build/output/${APP_NAME}-${APP_VERSION}.aab"
            echo "Successfully generated AAB at build/output/${APP_NAME}-${APP_VERSION}.aab"
          else
            echo "::error::Release AAB was not produced"
            exit 1
          fi

          RAW_MAPPING=$(find android/app/build/outputs/mapping -name "mapping.txt" 2>/dev/null | head -n 1)
          if [ -n "$RAW_MAPPING" ] && [ -f "$RAW_MAPPING" ]; then
            cp "$RAW_MAPPING" "build/output/mapping.txt"
            echo "Successfully generated mapping at build/output/mapping.txt"
          fi

      - name: Upload to Google Play Store
        # `ENABLE_PLAY_UPLOAD` is an opt-OUT, checked only here.
        #
        # Google's Developer API cannot create an app record; the record and its
        # first release have to be made by hand in the Play Console. Until that
        # exists the upload fails with "Package not found: com.altixcode.X" and
        # takes the whole run red -- after the app has compiled and signed
        # perfectly, and after iOS has already uploaded. A fleet where twenty-odd
        # repos are permanently red is a fleet where nobody reads red.
        #
        # Unset means true, so this changes nothing anywhere until a repo sets it
        # to 'false', and it is per-repo rather than fleet-wide.
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.submit_to_stores == true) || vars.ENABLE_STORE_UPLOADS == 'true') && vars.ENABLE_PLAY_UPLOAD != 'false' }}
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.altixcode.worddrop
          releaseFiles: build/output/${{ steps.version.outputs.app_name }}-${{ steps.version.outputs.app_version }}.aab
          mappingFile: build/output/mapping.txt
          track: ${{ vars.PLAY_STORE_TRACK || 'production' }}
          status: ${{ vars.PLAY_STORE_STATUS || 'completed' }}
          # Must be false until the app has been published once. Play answers
          # "Changes are sent for review automatically. The query parameter
          # changesNotSentForReview must not be set." and fails the whole
          # Android job *after* the AAB has already uploaded successfully —
          # so it reads like an upload failure when the upload worked.
          changesNotSentForReview: false
          releaseName: ${{ steps.version.outputs.app_name }} ${{ steps.version.outputs.app_version }}

      - name: Stash Android Artifacts
        if: github.server_url == 'https://github.com'
        # A stash failure must not fail the release.
        #
        # This uploads a convenience COPY of an artefact the pipeline has
        # already delivered: the IPA goes to TestFlight and App Store Connect
        # in an earlier step, and the AAB to Play. When the org hits the
        # Actions artifact storage quota this step fails with
        # "Failed to CreateArtifact: Artifact storage quota has been hit",
        # and it took whole release runs red on builds that had succeeded and
        # already uploaded. A red run that is not a broken build is worse than
        # no run at all, because it trains people to ignore red.
        #
        # `continue-on-error` still marks the step failed and annotates the
        # run, so the quota problem stays visible. It just stops it pretending
        # the release failed.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/output/*.apk
            build/output/*.aab
            build/output/mapping.txt
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: [build-ios, build-android]
    if: github.server_url == 'https://github.com' && (needs.build-ios.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Stashed Artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/download-artifact@v4
        with:
          path: build/downloaded

      - name: Prepare Release Packages & Checksums
        id: prep
        run: |
          mkdir -p build/output
          find build/downloaded -type f \( -name "*.ipa" -o -name "*.apk" -o -name "*.aab" \) -exec cp {} build/output/ \;

          COMMIT_COUNT=$(git rev-list --count HEAD)
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name)")
          APP_VERSION="1.0.$COMMIT_COUNT"
          APP_BUILD="$COMMIT_COUNT"
          TAG_NAME="v$APP_VERSION"

          cd build/output
          shasum -a 256 *.ipa *.apk *.aab > SHA256SUMS.txt 2>/dev/null || true
          cd ../..

          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 12)
          REPO="${{ github.repository }}"

          cat << EOF > RELEASE_NOTES.md
          ## 🚀 ${APP_NAME} ${TAG_NAME} (Build ${APP_BUILD})

          ### 📦 Direct Download Packages
          | Package | Description | Target Platform / Architecture | Direct Download Link |
          |:---|:---|:---|:---|
          EOF

          if [ -f "build/output/${APP_NAME}-${APP_VERSION}.ipa" ]; then
            echo "| **\`${APP_NAME}-${APP_VERSION}.ipa\`** | Signed iOS Application Archive | iOS 15.0+ (TestFlight / Sideloading / AltStore) | [Download ${APP_NAME}-${APP_VERSION}.ipa](https://github.com/${REPO}/releases/download/${TAG_NAME}/${APP_NAME}-${APP_VERSION}.ipa) |" >> RELEASE_NOTES.md
          fi

          if [ -f "build/output/${APP_NAME}-${APP_VERSION}.apk" ]; then
            echo "| **\`${APP_NAME}-${APP_VERSION}.apk\`** | Standalone Universal APK (Recommended) | All Android Devices | [Download ${APP_NAME}-${APP_VERSION}.apk](https://github.com/${REPO}/releases/download/${TAG_NAME}/${APP_NAME}-${APP_VERSION}.apk) |" >> RELEASE_NOTES.md
          fi

          if [ -f "build/output/${APP_NAME}-${APP_VERSION}.aab" ]; then
            echo "| **\`${APP_NAME}-${APP_VERSION}.aab\`** | Google Play App Bundle | Android Play Store Distribution | [Download ${APP_NAME}-${APP_VERSION}.aab](https://github.com/${REPO}/releases/download/${TAG_NAME}/${APP_NAME}-${APP_VERSION}.aab) |" >> RELEASE_NOTES.md
          fi

          cat << EOF >> RELEASE_NOTES.md

          ### 🛡️ Privacy & Architecture Highlights
          - **Plays Offline**: The daily puzzle is fetched once and then played entirely on device; the bundled word list covers a failed fetch.
          - **Anti-Subscription Promise**: A single lifetime non-consumable unlock removes every ad and opens the archive. No subscriptions, no accounts.
          - **14-Language Support**: English, Spanish, French, German, Russian, Chinese, Japanese, Portuguese, Korean, Italian, Turkish, Arabic, Persian and Greek.

          ### 📝 Recent Changes
          ${CHANGELOG}

          ### 🔒 Binary Integrity (SHA-256)
          \`\`\`text
          $(cat build/output/SHA256SUMS.txt 2>/dev/null || echo "No checksums generated")
          \`\`\`
          EOF

          # Clean leading spaces in RELEASE_NOTES.md lines
          sed -i -e 's/^[ \t]*##/##/' RELEASE_NOTES.md
          sed -i -e 's/^[ \t]*###/###/' RELEASE_NOTES.md
          sed -i -e 's/^[ \t]*- /- /' RELEASE_NOTES.md

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v gh >/dev/null 2>&1 || brew install gh

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists - updating notes and assets."
            gh release edit "$TAG_NAME" \
              --title "${APP_NAME} ${TAG_NAME} (Build ${APP_BUILD})" \
              --notes-file RELEASE_NOTES.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            echo "Creating release $TAG_NAME."
            gh release create "$TAG_NAME" \
              --title "${APP_NAME} ${TAG_NAME} (Build ${APP_BUILD})" \
              --notes-file RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

          FILES=()
          for f in build/output/*.ipa build/output/*.apk build/output/*.aab build/output/SHA256SUMS.txt; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "Uploading ${#FILES[@]} artifacts to release $TAG_NAME..."
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
          else
            echo "Warning: No release artifacts found to upload."
          fi

      - name: Tag Git Commit
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi
